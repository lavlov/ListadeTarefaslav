<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1 id="titulo">Lista de Tarefas</h1>
        
        <!--Campo para adição das tarefas-->
        <div class="entrada">
            <label for="add-tarefa" class="sr-only">Nova tarefa</label>
            <input type="text" id="add-tarefa" placeholder="Digite uma tarefa">
            <button type="button" id="btn-add">Adicionar</button>
        </div>


        <!--Lista de tarefas-->
        <ul id="tarefas"></ul>

    </div>

    <script src="js/script.js"></script>
    
</body>

</html>
